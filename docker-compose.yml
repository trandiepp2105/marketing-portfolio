services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    command: npm start -- --host 0.0.0.0
    environment:
      HOST: 0.0.0.0
      PORT: 3000
    expose:
      - "3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - portfolio

  nginx:
    image: nginx:alpine
    depends_on:
      - frontend
    ports:
      - "0.0.0.0:80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - portfolio

networks:
  portfolio:
    driver: bridge
